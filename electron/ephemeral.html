<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ephemeral Command Center</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
      -webkit-app-region: drag; /* Allows moving the window if not absolute center */
    }

    .search-box {
      width: 100%;
      max-width: 580px;
      height: 56px;
      background: rgba(30, 30, 34, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-sizing: border-box;
      -webkit-app-region: no-drag;
    }

    .icon {
      color: #a978ff;
      margin-right: 12px;
      display: flex;
      align-items: center;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 20px;
      font-weight: 500;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-box">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" id="ephemeral-input" placeholder="Search, ask AI, or open a URL..." autocomplete="off">
    </div>
  </div>
  <script src="ephemeral-renderer.js"></script>
</body>
</html>
