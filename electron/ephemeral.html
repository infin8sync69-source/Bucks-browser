<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soul Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Outer shell ── */
    #shell {
      width: 100%;
      background: rgba(22, 22, 28, 0.97);
      backdrop-filter: blur(48px) brightness(1.08);
      -webkit-backdrop-filter: blur(48px) brightness(1.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255,255,255,0.06) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── Input row (always visible) ── */
    #input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 54px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #soul-icon {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      color: #a978ff;
      opacity: 0.85;
    }

    #ephemeral-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      font-family: inherit;
      line-height: 1;
      min-width: 0;
    }
    #ephemeral-input::placeholder { color: rgba(255,255,255,0.28); }

    #status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status-dot.thinking {
      background: #a978ff;
      box-shadow: 0 0 0 3px rgba(169,120,255,0.2);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    #status-dot.done { background: #2ed573; box-shadow: 0 0 0 3px rgba(46,213,115,0.15); }
    #status-dot.err  { background: #ff4757; box-shadow: none; }
    @keyframes pulse-dot { 0%,100% { opacity:1 } 50% { opacity:0.35 } }

    /* ── Response area ── */
    #response-area {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    #response-area.visible { display: flex; }

    #divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    #response-text {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      font-size: 13.5px;
      line-height: 1.65;
      color: rgba(255,255,255,0.88);
      word-break: break-word;
      -webkit-app-region: no-drag;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    #response-text::-webkit-scrollbar { width: 4px; }
    #response-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* Blinking cursor while streaming */
    #response-text.streaming::after {
      content: '▋';
      display: inline-block;
      color: #a978ff;
      animation: blink 0.9s step-end infinite;
      font-size: 12px;
      vertical-align: baseline;
    }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }

    /* ── Action chips ── */
    #chips-row {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 10px;
      flex-wrap: wrap;
      -webkit-app-region: no-drag;
    }
    #chips-row.visible { display: flex; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .chip:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #fff; }
    .chip.primary {
      background: rgba(169,120,255,0.15);
      border-color: rgba(169,120,255,0.35);
      color: #c8a4ff;
    }
    .chip.primary:hover { background: rgba(169,120,255,0.25); border-color: rgba(169,120,255,0.55); }
    .chip svg { flex-shrink: 0; }

    /* ── Error state ── */
    #error-msg {
      display: none;
      padding: 10px 16px 12px;
      font-size: 12px;
      color: rgba(255,100,100,0.85);
    }
    #error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div id="shell">
    <!-- Input row — always visible -->
    <div id="input-row">
      <div id="soul-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 1 7 7c0 3.5-2 6-4 8l-3 3-3-3c-2-2-4-4.5-4-8a7 7 0 0 1 7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </div>

      <input type="text" id="ephemeral-input"
             placeholder="Ask the Soul Engine…"
             autocomplete="off" spellcheck="false" />

      <div id="status-dot" title="Soul Engine status"></div>
    </div>

    <!-- Response area — revealed after first submit -->
    <div id="response-area">
      <div id="divider"></div>
      <div id="response-text"></div>
      <div id="error-msg"></div>

      <!-- Action chips — shown after response completes -->
      <div id="chips-row">
        <button class="chip primary" id="chip-open-chat">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          Open in chat
        </button>
        <button class="chip" id="chip-copy">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button class="chip" id="chip-again">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>
          Ask again
        </button>
        <button class="chip" id="chip-dismiss">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Dismiss
        </button>
      </div>
    </div>
  </div>

  <script src="ephemeral-renderer.js"></script>
</body>
</html>
