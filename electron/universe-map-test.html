<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal Map — dev harness</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; padding:0; height:100vh; overflow:hidden; background:#1a1a1c; font-family:'Instrument Sans',system-ui,sans-serif; color:#fff; user-select:none; }
  </style>
</head>
<body>
  <div id="bg-glow" style="position:fixed; inset:0; z-index:0; pointer-events:none; background: radial-gradient(58% 50% at 18% 8%, rgba(123,63,228,0.15), transparent 62%), radial-gradient(45% 45% at 86% 70%, rgba(123,63,228,0.1), transparent 65%), linear-gradient(165deg, #1f1f23 0%, #151518 55%, #0d0d10 100%);"></div>
  <canvas id="three-bg-canvas" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></canvas>
  <div style="position:fixed; inset:0; z-index:0; background:radial-gradient(120% 110% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.34) 100%); pointer-events:none;"></div>

  <!-- minimal stand-in for the newtab view so the HUD activates -->
  <div class="app-container" style="position:relative; z-index:1; min-height:100vh;">
    <div id="view-newtab" class="dashboard-view" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:24px;">
      <div style="font-family:Sora; font-size:44px; font-weight:700; opacity:.9;">21:47</div>
      <div class="nt-search-wrap" style="width:420px; padding:12px 18px; border-radius:14px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(20px);">
        <input style="width:100%; background:none; border:none; outline:none; color:#fff; font-family:inherit;" placeholder="Ask Bucks or search the web…">
      </div>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="universe-data.js"></script>
  <script src="universe-map.js"></script>
</body>
</html>
