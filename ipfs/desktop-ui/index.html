<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPFS Cluster — Commander</title>
<style>
  /* Nimble Commander - style dual-pane theme */
  :root {
    --bg: #1e2128;
    --panel-bg: #23262e;
    --panel-alt: #262a33;
    --header-bg: #2b2f3a;
    --border: #3a3f4d;
    --text: #d6dae3;
    --dim: #8a90a0;
    --focus-frame: #4d78cc;
    --sel-bg: #2f4f86;
    --cursor-bg: #4d78cc;
    --cursor-text: #ffffff;
    --dir-color: #e8eaf0;
    --keybar-bg: #1a1d23;
    --keybar-key: #5b8cff;
    --mono: "SF Mono", Menlo, Monaco, ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    user-select: none;
  }

  /* top toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--header-bg); border-bottom: 1px solid var(--border);
    padding: 6px 10px; font-size: 12px;
  }
  .toolbar .conn { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .toolbar .dot { width: 7px; height: 7px; border-radius: 50%; background: #e05555; display: inline-block; margin-right: 5px; }
  .toolbar .dot.on { background: #43c478; }
  .toolbar .spacer { flex: 1; }
  .toolbar button {
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--focus-frame); }

  /* dual panes */
  .panes { flex: 1; display: flex; min-height: 0; }
  .pane {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    border: 1px solid var(--border); margin: 4px; background: var(--panel-bg);
  }
  .pane.focused { border-color: var(--focus-frame); }
  .pane .pathbar {
    background: var(--header-bg); padding: 3px 8px;
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pane.focused .pathbar { color: var(--text); background: #313748; }

  .pane .cols {
    display: grid; grid-template-columns: 1fr 90px 130px;
    background: var(--panel-alt); border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--dim);
  }
  .pane .cols span { padding: 3px 8px; border-right: 1px solid var(--border); }
  .pane .cols span:last-child { border-right: none; }

  .pane .list { flex: 1; overflow-y: auto; outline: none; }
  .row {
    display: grid; grid-template-columns: 1fr 90px 130px;
    cursor: default; font-size: 13px;
  }
  .row > span {
    padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .sz, .row .dt { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
  .row .nm { color: var(--dir-color); }
  .row.f .nm { color: var(--text); }
  .row.dir .nm::before { content: "▸ "; color: var(--dim); }
  .row.up .nm::before { content: ""; }
  .row.selected { background: var(--sel-bg); }
  .row.selected .nm, .row.selected .sz, .row.selected .dt { color: #ffd866; }
  .pane.focused .row.cursor { background: var(--cursor-bg); }
  .pane.focused .row.cursor .nm, .pane.focused .row.cursor .sz, .pane.focused .row.cursor .dt { color: var(--cursor-text); }
  .pane:not(.focused) .row.cursor { background: #333a49; }

  .pane .status {
    background: var(--header-bg); border-top: 1px solid var(--border);
    padding: 2px 8px; font-size: 11px; color: var(--dim);
    font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* bottom function-key bar, NC/Norton style */
  .keybar {
    display: flex; background: var(--keybar-bg); border-top: 1px solid var(--border);
  }
  .keybar div {
    flex: 1; text-align: center; padding: 4px 2px; font-size: 11px;
    border-right: 1px solid var(--border); cursor: pointer; color: var(--dim);
  }
  .keybar div:hover { background: var(--panel-alt); color: var(--text); }
  .keybar b { color: var(--keybar-key); font-family: var(--mono); margin-right: 4px; }

  /* dialogs */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel-bg); border: 1px solid var(--focus-frame); border-radius: 8px;
    min-width: 420px; max-width: 70vw; max-height: 80vh; overflow: auto;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  .dialog h2 { font-size: 13px; padding: 8px 14px; background: var(--header-bg); border-bottom: 1px solid var(--border); }
  .dialog .body { padding: 14px; font-size: 13px; }
  .dialog .body input[type=text] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 8px; font: 13px var(--mono); outline: none;
  }
  .dialog .body input[type=text]:focus { border-color: var(--focus-frame); }
  .dialog .btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .dialog .btns button {
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 16px; font-size: 12px; cursor: pointer;
  }
  .dialog .btns button.primary { background: var(--cursor-bg); border-color: var(--cursor-bg); color: #fff; }
  .dialog pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 10px; font: 12px var(--mono); white-space: pre-wrap; word-break: break-all;
    max-height: 50vh; overflow: auto; user-select: text;
  }
  .dialog img { max-width: 100%; }
  .drop-hint {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(77,120,204,.18); border: 3px dashed var(--focus-frame); z-index: 5;
    font-size: 20px; color: var(--text); pointer-events: none;
  }
  body.dragover .drop-hint { display: flex; }
  /* context menu */
  .ctx {
    position: fixed; z-index: 20; display: none; min-width: 190px;
    background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); padding: 4px 0;
  }
  .ctx.show { display: block; }
  .ctx div { padding: 5px 14px; font-size: 12px; cursor: pointer; }
  .ctx div:hover { background: var(--cursor-bg); color: #fff; }
  .pathbar button.nav {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 12px; padding: 0 4px; font-family: inherit;
  }
  .pathbar button.nav:hover { color: var(--text); }
  #xferText { color: #ffd866; }
  #searchBox {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 8px; font: 12px var(--mono); outline: none; width: 180px;
  }
  #searchBox:focus { border-color: var(--focus-frame); }
  #searchBox.active { border-color: #ffd866; }

  /* View Modes */
  .pane .list.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px; padding: 10px; align-content: start;
  }
  .pane .list.tiles {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px; padding: 10px; align-content: start;
  }
  .row.grid, .row.tiles {
    display: flex; cursor: default;
    border-radius: 6px; padding: 8px; border: 1px solid transparent;
  }
  .row.grid { flex-direction: column; align-items: center; text-align: center; }
  .row.tiles { flex-direction: row; align-items: center; text-align: left; }
  
  .row.grid:hover, .row.tiles:hover { background: #2a2e38; }
  .row.grid.selected, .row.tiles.selected { background: var(--sel-bg); border-color: var(--focus-frame); }
  .pane.focused .row.grid.cursor, .pane.focused .row.tiles.cursor { background: var(--cursor-bg); }
  .pane:not(.focused) .row.grid.cursor, .pane:not(.focused) .row.tiles.cursor { background: #333a49; }
  
  .row.grid .icon { font-size: 48px; width: 64px; height: 64px; display:flex; align-items:center; justify-content:center; margin-bottom: 8px; }
  .row.tiles .icon { font-size: 32px; width: 48px; height: 48px; display:flex; align-items:center; justify-content:center; margin-right: 10px; }
  
  .row.grid .nm { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .row.tiles .details { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
  .row.tiles .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
  .row.tiles .sz, .row.tiles .dt { font-size: 11px; color: var(--dim); text-align: left; padding: 0; }
  
  .row .icon svg { width: 100%; height: 100%; fill: currentColor; }
  .row.dir .icon { color: #82aaff; }
  .row.f .icon { color: #c3ccdf; }
  
  .row:not(.grid):not(.tiles) .icon { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; }
  
  /* Filter & Sort Headers */
  .pane .cols span { cursor: pointer; user-select: none; }
  .pane .cols span:hover { background: rgba(255,255,255,0.1); }
  .pane .cols span.sort-asc::after { content: " ↑"; }
  .pane .cols span.sort-desc::after { content: " ↓"; }

</style>
</head>
<body tabindex="0">

<div class="toolbar">
  <span><span class="dot" id="dot"></span><span id="connText">ipfscluster://127.0.0.1:9094</span></span>
  <span class="conn" id="peersText"></span>
  <span class="conn" id="xferText"></span>
  <span class="spacer"></span>
  <select id="typeFilterBox" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px;font-size:12px">

<script>
const API = 'http://127.0.0.1:9094';
const KUBO = 'http://127.0.0.1:5001';
const GW = 'http://127.0.0.1:8080';
const $ = (s, r=document) => r.querySelector(s);

const ICONS = {
  folder: '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>',
  image: '<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
  video: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
  text: '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
  file: '<svg viewBox="0 0 24 24"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm6 7V3.5L18.5 9H12z"/></svg>',
  pdf: '<svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM16.5 9h-1v1.5h1V9z"/><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>'
};

function getIcon(e) {
  if (e.dir) return ICONS.folder;
  const n = e.name.toLowerCase();
  if (/\.(png|jpe?g|gif|webp|svg)$/.test(n)) return ICONS.image;
  if (/\.(mp4|webm|ogg|mov)$/.test(n)) return ICONS.video;
  if (/\.pdf$/.test(n)) return ICONS.pdf;
  if (/\.(txt|md|js|html|css|json|csv)$/.test(n)) return ICONS.text;
  return ICONS.file;
}

function setViewMode(mode) {
  panes.forEach(p => { p.viewMode = mode; p.render(); });
}

const fmtSize = (n) => {
  if (n == null || n < 0) return '—';
  if (n < 1024) return String(n);
  const u = ['K','M','G','T']; let i = -1;
  while (n >= 1024 && i < 3) { n /= 1024; i++; }
  return n.toFixed(n >= 10 ? 0 : 1) + ' ' + u[i];
};
const fmtDate = (t) => {
  if (!t) return '—';
  const d = new Date(t);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

async function ndjson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('http ' + r.status);
  const text = await r.text();
  try { const j = JSON.parse(text); return Array.isArray(j) ? j : [j]; }
  catch { return text.trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)); }
}


async function ipfsPatch(dirCid, name, itemCid, remove=false) {
  if (remove) {
    const r = await fetch(`${KUBO}/api/v0/object/patch/rm-link?arg=${dirCid}&arg=${encodeURIComponent(name)}`, {method:'POST'});
    const j = await r.json(); return j.Hash;
  } else {
    const rmR = await fetch(`${KUBO}/api/v0/object/patch/rm-link?arg=${dirCid}&arg=${encodeURIComponent(name)}`, {method:'POST'});
    let cleanDir = dirCid;
    if (rmR.ok) { const j = await rmR.json(); if (j.Hash) cleanDir = j.Hash; }
    const r2 = await fetch(`${KUBO}/api/v0/object/patch/add-link?arg=${cleanDir}&arg=${encodeURIComponent(name)}&arg=${itemCid}`, {method:'POST'});
    const j2 = await r2.json(); return j2.Hash;
  }
}

async function updatePathTree(pane, leafCid) {
  let currentCid = leafCid;
  for (let i = pane.path.length - 1; i >= 1; i--) {
    const parent = pane.path[i-1];
    const childName = pane.path[i].name;
    currentCid = await ipfsPatch(parent.cid, childName, currentCid, false);
    pane.path[i].cid = currentCid; 
  }
  const oldRootCid = pane.path[0].cid;
  const rootName = pane.path[0].name;
  await fetch(`${API}/pins/${currentCid}?name=${encodeURIComponent(rootName)}`, {method:'POST'});
  await fetch(`${API}/pins/${oldRootCid}`, {method:'DELETE'});
  pane.path[0].cid = currentCid;
}

async function performCopyMove(sourceItem, targetPane, targetFolderEntry, action) {
  setXfer(`\u21EA ${action}ing ${sourceItem.name}...`);
  try {
    if (targetFolderEntry) {
      const newDir = await ipfsPatch(targetFolderEntry.cid, sourceItem.name, sourceItem.cid, false);
      if (targetPane.path.length === 0) {
        await fetch(`${API}/pins/${newDir}?name=${encodeURIComponent(targetFolderEntry.name)}`, {method:'POST'});
        await fetch(`${API}/pins/${targetFolderEntry.cid}`, {method:'DELETE'});
      } else {
        const newParent = await ipfsPatch(targetPane.path[targetPane.path.length-1].cid, targetFolderEntry.name, newDir, false);
        await updatePathTree(targetPane, newParent);
      }
    } else {
      if (targetPane.path.length === 0) {
        await fetch(`${API}/pins/${sourceItem.cid}?name=${encodeURIComponent(sourceItem.name)}`, {method:'POST'});
      } else {
        const newDir = await ipfsPatch(targetPane.path[targetPane.path.length-1].cid, sourceItem.name, sourceItem.cid, false);
        await updatePathTree(targetPane, newDir);
      }
    }
    
    if (action === 'move') {
      const sourcePane = panes[sourceItem.paneId];
      if (sourceItem.isRoot) {
        await fetch(`${API}/pins/${sourceItem.cid}`, {method:'DELETE'});
      } else {
        const newDir = await ipfsPatch(sourcePane.path[sourcePane.path.length-1].cid, sourceItem.name, null, true);
        await updatePathTree(sourcePane, newDir);
      }
    }
  } catch(e) { console.error(e); }
  setXfer('');
  refreshBoth();
}

// ---- pane model -------------------------------------------------------------------------------
// path: [] = cluster root (the pinset). Deeper: [{name, cid}, ...]
class Pane {
  constructor(el) {
    this.el = el;
    this.path = [];
    this.entries = [];
    this.cursor = 0;
    this.selected = new Set();
    this.hist = [];
    this.all = [];
    this.filter = '';
    this.viewMode = 'list';
    this.sortField = 'name';
    this.sortAsc = true;
  }
  pathString() {
    return '/' + this.path.map((p) => p.name).join('/') + (this.path.length ? '/' : '');
  }
  cidPath() { // ipfs path for current dir, '' at root
    if (!this.path.length) return '';
    return this.path[0].cid + this.path.slice(1).map((p) => '/' + p.name).join('');
  }
  async load(keepCursor=false) {
    const old = keepCursor ? this.entries[this.cursor]?.name : null;
    try {
      if (!this.path.length) {
        const pins = await ndjson(`${API}/pins`);
        const sizes = await Promise.all(pins.map((p) => statCid(typeof p.cid === 'string' ? p.cid : p.cid['/'])));
        this.all = pins.map((p, i) => {
          const cid = typeof p.cid === 'string' ? p.cid : p.cid['/'];
          return {
            name: p.name && !p.name.includes('/') ? p.name : cid,
            cid,
            dir: sizes[i]?.dir ?? false,
            size: sizes[i]?.size ?? -1,
            date: p.created ? Date.parse(p.created) : 0,
            pin: true,
          };
        }).sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
      }
      else {
        const r = await fetch(`${KUBO}/api/v0/ls?arg=` + encodeURIComponent(this.cidPath()), { method: 'POST' });
        const j = await r.json();
        const links = j.Objects?.[0]?.Links || [];
        this.all = links.map((l) => ({
          name: l.Name, cid: l.Hash, dir: l.Type === 1, size: l.Type === 1 ? -1 : l.Size, date: 0, pin: false,
        })).sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
        this.all.unshift({ name: '..', up: true, dir: true, size: -1, date: 0 });
      }
      $('#dot').classList.add('on');
    } catch (e) {
      this.all = [];
      $('#dot').classList.remove('on');
    }
    this.applyFilter();
    this.selected.clear();
    this.cursor = Math.max(0, old ? this.entries.findIndex((e) => e.name === old) : 0);
    if (this.cursor === -1) this.cursor = 0;
    this.render();
  }
  cur() { return this.entries[this.cursor]; }
  render() {
    const pb = $('.pathbar', this.el);
    pb.innerHTML = `<button class="nav" title="Back">←</button><button class="nav" title="Up">↑</button><button class="nav" title="Home">⌂</button><span></span>`;
    pb.lastChild.textContent = ' ipfs-cluster:' + this.pathString();
    const [bBack, bUp, bHome] = pb.querySelectorAll('button');
    bBack.onclick = () => { focusPane(this); this.back(); };
    bUp.onclick = () => { focusPane(this); this.up(); };
    bHome.onclick = () => { focusPane(this); this.home(); };
    
    // Sort headers
    const cols = $('.cols', this.el);
    cols.innerHTML = `<span data-sort="name">Name</span><span data-sort="size" style="text-align:right">Size</span><span data-sort="date" style="text-align:right">Date Created</span>`;
    [...cols.children].forEach(c => {
      const f = c.getAttribute('data-sort');
      if (this.sortField === f) c.className = this.sortAsc ? 'sort-asc' : 'sort-desc';
      c.onclick = () => {
        if (this.sortField === f) this.sortAsc = !this.sortAsc;
        else { this.sortField = f; this.sortAsc = f==='name'; }
        this.applyFilter();
        this.render();
      };
    });

    const list = $('.list', this.el);
    list.ondragover = (ev) => ev.preventDefault();
    list.ondrop = async (ev) => {
      ev.preventDefault();
      const data = ev.dataTransfer.getData('text/plain');
      if (!data) return;
      try {
        const item = JSON.parse(data);
        if (item.internalDrop) {
          ev.stopPropagation();
          if (item.paneId === panes.indexOf(this) && item.pathJson === JSON.stringify(this.path)) return;
          await performCopyMove(item, this, null, ev.shiftKey ? 'copy' : 'move');
        }
      } catch(e) {}
    };
    list.className = 'list ' + this.viewMode;
    list.innerHTML = '';
    
    this.entries.forEach((e, i) => {
      const row = document.createElement('div');
      if (!e.up) {
        row.draggable = true;
        row.ondragstart = (ev) => {
          ev.dataTransfer.setData('text/plain', JSON.stringify({
            internalDrop: true, cid: e.cid, name: e.name, 
            paneId: panes.indexOf(this), isRoot: this.path.length===0,
            pathJson: JSON.stringify(this.path)
          }));
        };
      }
      if (e.dir && !e.up) {
        row.ondragover = (ev) => { ev.preventDefault(); row.style.background = 'rgba(255,255,255,0.2)'; };
        row.ondragleave = (ev) => { row.style.background = ''; };
        row.ondrop = async (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          row.style.background = '';
          const data = ev.dataTransfer.getData('text/plain');
          if (!data) return;
          try {
            const item = JSON.parse(data);
            if (item.internalDrop) {
              await performCopyMove(item, this, e, ev.shiftKey ? 'copy' : 'move');
            }
          } catch(err) {}
        };
      }

      row.className = 'row ' + this.viewMode + (e.dir ? ' dir' : ' f') + (e.up ? ' up' : '') +
        (i === this.cursor ? ' cursor' : '') + (this.selected.has(i) ? ' selected' : '');
      
      const iconHTML = `<span class="icon">${e.up ? ICONS.folder : getIcon(e)}</span>`;
      
      if (this.viewMode === 'list') {
        row.innerHTML = `${iconHTML}<span class="nm"></span><span class="sz"></span><span class="dt"></span>`;
        row.children[1].textContent = e.up ? '..' : e.name;
        row.children[2].textContent = e.dir ? (e.up ? 'Up' : 'Folder') : fmtSize(e.size);
        row.children[3].textContent = fmtDate(e.date);
      } else if (this.viewMode === 'grid') {
        // optionally load actual thumbnail here if image, but sticking to icons to save memory/data
        row.innerHTML = `${iconHTML}<span class="nm" title="${e.name.replace(/"/g,'&quot;')}">${e.up ? '..' : e.name}</span>`;
      } else { // tiles
        row.innerHTML = `${iconHTML}<div class="details"><span class="nm" title="${e.name.replace(/"/g,'&quot;')}">${e.up ? '..' : e.name}</span>
          <span class="sz">${e.dir ? (e.up?'':'Folder') : fmtSize(e.size)}</span>
          <span class="dt">${fmtDate(e.date)}</span></div>`;
      }
      
      row.onclick = () => { focusPane(this); this.cursor = i; this.render(); };
      row.ondblclick = () => { focusPane(this); this.cursor = i; this.enter(); };
      row.oncontextmenu = (ev) => { ev.preventDefault(); focusPane(this); this.cursor = i; this.render(); ctxMenu(ev, e); };
      list.appendChild(row);
    });
    
    const files = this.entries.filter((e) => !e.dir).length;
    const dirs = this.entries.filter((e) => e.dir && !e.up).length;
    const bytes = this.entries.reduce((a, e) => a + Math.max(0, e.size), 0);
    $('.status', this.el).textContent =
      `${files} files, ${dirs} folders · ${fmtSize(bytes)}B` + (this.selected.size ? ` · ${this.selected.size} selected` : '') +
      (this.filter || typeFilterBox.value ? ` · filtered (${this.all.length - this.entries.length} hidden)` : '');
    const c = $('.row.cursor', this.el);
    if (c) c.scrollIntoView({ block: 'nearest' });
  }
  async enter() {
    const e = this.cur();
    if (!e) return;
    if (e.up) { await this.up(); return; }
    if (e.dir) { await this.go([...this.path, { name: e.name, cid: e.cid }]); return; }
    viewFile(e); // Enter on a file = view, like NC's preview
  }
  applyFilter() {
    const q = this.filter.toLowerCase();
    const typeFilt = typeFilterBox.value;
    let list = this.all;
    if (q) list = list.filter((e) => e.up || e.name.toLowerCase().includes(q) || (e.cid || '').toLowerCase().includes(q));
    if (typeFilt) {
      list = list.filter((e) => {
        if (e.up) return true;
        if (typeFilt === 'folder') return e.dir;
        const n = e.name.toLowerCase();
        if (typeFilt === 'image') return /\.(png|jpe?g|gif|webp|svg)$/.test(n);
        if (typeFilt === 'video') return /\.(mp4|webm|ogg|mov)$/.test(n);
        if (typeFilt === 'pdf') return /\.pdf$/.test(n);
        return true;
      });
    }
    
    // Sort
    const s = this.sortField;
    const a = this.sortAsc ? 1 : -1;
    list.sort((x, y) => {
      if (x.up) return -1; if (y.up) return 1;
      if (x.dir !== y.dir) return x.dir ? -1 : 1; // folders always first
      if (s === 'name') return x.name.localeCompare(y.name) * a;
      if (s === 'size') return (x.size - y.size) * a;
      if (s === 'date') return (x.date - y.date) * a;
      return 0;
    });
    this.entries = list;
  }
  setFilter(q) {
    this.filter = q;
    this.applyFilter();
    this.cursor = 0;
    this.selected.clear();
    this.render();
  }
  async go(p) { this.hist.push(this.path.slice()); this.path = p; await this.load(); }
  async back() { if (this.hist.length) { this.path = this.hist.pop(); await this.load(); } }
  async up() { if (this.path.length) await this.go(this.path.slice(0, -1)); }
  async home() { if (this.path.length) await this.go([]); }
  move(d) {
    this.cursor = Math.min(this.entries.length - 1, Math.max(0, this.cursor + d));
    this.render();
  }
}

const statCache = {};
async function statCid(cid) {
  if (statCache[cid]) return statCache[cid];
  try {
    const r = await fetch(`${KUBO}/api/v0/files/stat?arg=` + encodeURIComponent('/ipfs/' + cid), { method: 'POST' });
    const j = await r.json();
    return (statCache[cid] = { dir: j.Type === 'directory', size: j.Type === 'directory' ? -1 : j.Size });
  } catch { return null; }
}

const panes = [new Pane($('#pane0')), new Pane($('#pane1'))];
let active = 0;
function focusPane(p) { active = panes.indexOf(p); panes.forEach((q, i) => q.el.classList.toggle('focused', i === active)); }
function pane() { return panes[active]; }
function refreshBoth() { panes.forEach((p) => p.load(true)); loadPeers(); }

// ---- dialogs ----------------------------------------------------------------------------------
function dialog(html) {
  $('#dialog').innerHTML = html;
  $('#overlay').classList.add('show');
}
function closeDialog() { $('#overlay').classList.remove('show'); document.body.focus(); }
$('#overlay').onclick = (e) => { if (e.target === $('#overlay')) closeDialog(); };

function gatewayURL(e, p) {
  const base = p.cidPath();
  const ipfsPath = e.pin ? e.cid : base + '/' + e.name;
  return `${GW}/ipfs/${ipfsPath}?filename=${encodeURIComponent(e.name)}`;
}

async function viewFile(e) {
  const p = pane();
  if (!e || e.dir) return;
  const url = gatewayURL(e, p);
  const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(e.name);
  if (isImg) {
    dialog(`<h2>${e.name}</h2><div class="body"><img src="${url}"></div>
      <div class="btns"><button class="primary" onclick="closeDialog()">Close (Esc)</button></div>`);
    return;
  }

  try {
    const headReq = await fetch(url, { method: 'HEAD' });
    const contentType = headReq.headers.get('content-type') || '';
    
    if (contentType.startsWith('video/') || /\.(mp4|webm|ogg|mov)$/i.test(e.name)) {
      dialog(`<h2>${e.name}</h2><div class="body" style="text-align:center"><video src="${url}" controls autoplay style="max-width:100%;max-height:60vh;"></video></div>
        <div class="btns"><button class="primary" onclick="closeDialog()">Close (Esc)</button></div>`);
      return;
    }
    
    if (contentType === 'application/pdf' || /\.pdf$/i.test(e.name)) {
      dialog(`<h2>${e.name}</h2><div class="body"><iframe src="${url}" style="width:100%;height:65vh;border:none;"></iframe></div>
        <div class="btns"><button class="primary" onclick="closeDialog()">Close (Esc)</button></div>`);
      return;
    }
  } catch (err) {
    console.error("HEAD request failed:", err);
  }
  const r = await fetch(url);
  const blob = await r.blob();
  if (blob.size > 512 * 1024) {
    dialog(`<h2>${e.name}</h2><div class="body">File is ${fmtSize(blob.size)}B — too large to preview. Use F5 to download.</div>
      <div class="btns"><button class="primary" onclick="closeDialog()">Close (Esc)</button></div>`);
    return;
  }
  const text = await blob.text();
  const pre = document.createElement('pre');
  pre.textContent = text;
  dialog(`<h2>${e.name} — ${fmtSize(blob.size)}B</h2><div class="body"></div>
    <div class="btns"><button class="primary" onclick="closeDialog()">Close (Esc)</button></div>`);
  $('#dialog .body').appendChild(pre);
}

function cidDialog(e) {
  if (!e) return;
  dialog(`<h2>Content Identifier</h2><div class="body"><pre>${e.cid || '—'}</pre></div>
    <div class="btns">
      <button onclick="navigator.clipboard.writeText('${e.cid}'); closeDialog()">Copy</button>
      <button class="primary" onclick="closeDialog()">Close</button>
    </div>`);
}

function download(e) {
  if (!e || e.dir) return;
  const url = gatewayURL(e, pane()) + '&download=true';
  if (window.__TAURI__?.opener) { window.__TAURI__.opener.openUrl(url); return; }
  const a = document.createElement('a');
  a.href = url;
  a.download = e.name;
  a.click();
}

function renameDialog(e) {
  const p = pane();
  if (!e || !e.pin) { return; } // only pins (root entries) can be renamed
  dialog(`<h2>Rename pin</h2><div class="body">
      <input type="text" id="rnInput" value="${e.name.replace(/"/g,'&quot;')}">
    </div>
    <div class="btns">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" id="rnOk">Rename</button>
    </div>`);
  const input = $('#rnInput');
  input.focus(); input.select();
  const go = async () => {
    const name = input.value.trim();
    if (name && name !== e.name)
      await fetch(`${API}/pins/${e.cid}?name=${encodeURIComponent(name)}`, { method: 'POST' });
    closeDialog();
    refreshBoth();
  };
  $('#rnOk').onclick = go;
  input.onkeydown = (ev) => { if (ev.key === 'Enter') go(); if (ev.key === 'Escape') closeDialog(); };
}

function unpinDialog() {
  const p = pane();
  const targets = p.selected.size ? [...p.selected].map((i) => p.entries[i]) : [p.cur()];
  const pins = targets.filter((e) => e && e.pin);
  if (!pins.length) return;
  dialog(`<h2>Unpin</h2><div class="body">
      Unpin ${pins.length === 1 ? `"${pins[0].name}"` : pins.length + ' items'} from the cluster?<br>
      <span style="color:var(--dim)">The content is removed from cluster storage on garbage collection.</span>
    </div>
    <div class="btns">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" id="rmOk">Unpin (Enter)</button>
    </div>`);
  const go = async () => {
    for (const e of pins) await fetch(`${API}/pins/${e.cid}`, { method: 'DELETE' });
    closeDialog();
    refreshBoth();
  };
  $('#rmOk').onclick = go;
  window._confirmAction = go;
}

ipfs-cluster-service daemon --bootstrap ${addr}</pre>

const ADDURL = (n) => `${API}/add?name=${encodeURIComponent(n)}&stream-channels=false`;

// ---- context menu -----------------------------------------------------------------------------
function ctxMenu(ev, e) {
  const items = [
    !e.dir && ['View', () => viewFile(e)],
    e.dir && ['Open', () => pane().enter()],
    ['Show CID', () => cidDialog(e)],
    ['Copy link', () => navigator.clipboard.writeText(new URL(gatewayURL(e, pane()), location.href).href)],
    !e.dir && ['Download', () => download(e)],
    e.pin && ['Rename\u2026', () => renameDialog(e)],
    e.pin && ['Unpin\u2026', () => unpinDialog()],
  ].filter(Boolean);
  const m = $('#ctx');
  m.innerHTML = '';
  for (const [t, fn] of items) {
    const d = document.createElement('div');
    d.textContent = t;
    d.onclick = () => { hideCtx(); fn(); };
    m.appendChild(d);
  }
  m.style.left = Math.min(ev.pageX, innerWidth - 200) + 'px';
  m.style.top = Math.min(ev.pageY, innerHeight - items.length * 26 - 10) + 'px';
  m.classList.add('show');
}
function hideCtx() { $('#ctx').classList.remove('show'); }
window.addEventListener('click', hideCtx);
window.addEventListener('blur', hideCtx);

function setXfer(t) { $('#xferText').textContent = t; }
function xhrUpload(url, fd, label) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) setXfer(`\u21EA ${label} \u2014 ${Math.round(ev.loaded / ev.total * 100)}%`);
    };
    xhr.onload = () => resolve(xhr.status >= 200 && xhr.status < 300);
    xhr.onerror = () => resolve(false);
    xhr.send(fd);
  });
}

// ---- upload -----------------------------------------------------------------------------------
function uploadDialog() { $('#fileInput').click(); }
function uploadFolderDialog() { $('#dirInput').click(); }
$('#fileInput').onchange = (e) => { uploadEntries([...e.target.files].map((f) => ({ file: f, rel: f.name }))); e.target.value = ''; };
$('#dirInput').onchange = (e) => { uploadEntries([...e.target.files].map((f) => ({ file: f, rel: f.webkitRelativePath || f.name }))); e.target.value = ''; };

// items: [{file, rel}] where rel may contain '/' for files inside folders.
// Loose files become one pin each; each top-level folder becomes a single recursive pin.
async function uploadEntries(items) {
  if (!items.length) return;
  const groups = new Map();
  for (const it of items) {
    const top = it.rel.includes('/') ? it.rel.split('/')[0] : '';
    if (!groups.has(top)) groups.set(top, []);
    groups.get(top).push(it);
  }
  for (const [top, list] of groups) {
    if (top === '') {
      for (const it of list) {
        const fd = new FormData();
        fd.append('file', it.file, it.file.name);
        await xhrUpload(ADDURL(it.file.name), fd, it.file.name);
      }
    }
    else {
      const fd = new FormData();
      for (const it of list) fd.append('file', it.file, it.rel);
      await xhrUpload(ADDURL(top) + '&wrap-with-directory=false', fd, top + '/');
    }
  }
  setXfer('\u2713 added');
  setTimeout(() => setXfer(''), 3000);
  refreshBoth();
}

async function entryToItems(entry, prefix) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ file, rel: prefix + entry.name }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    while (true) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) out.push(...await entryToItems(e, prefix + entry.name + '/'));
    }
    return out;
  }
  return [];
}
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (e.dataTransfer.types && e.dataTransfer.types.includes('Files') && !e.dataTransfer.types.includes('text/plain')) {
    if (dragDepth++ === 0) document.body.classList.add('dragover');
  }
});
window.addEventListener('dragleave', (e) => { 
  if (e.dataTransfer.types && e.dataTransfer.types.includes('Files') && !e.dataTransfer.types.includes('text/plain')) {
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragover'); } 
  }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragover');
  if (e.dataTransfer.types && e.dataTransfer.types.includes('text/plain')) return; // handled by internal drops
  const entries = [...(e.dataTransfer.items || [])].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) {
    const items = [];
    for (const en of entries) items.push(...await entryToItems(en, ''));
    uploadEntries(items);
  }
  else if (e.dataTransfer.files.length) {
    uploadEntries([...e.dataTransfer.files].map((f) => ({ file: f, rel: f.name })));
  }
});

let clipBoard = null;

// ---- keyboard ---------------------------------------------------------------------------------
function kb(n) {
  const p = pane();
  if (n === 3) viewFile(p.cur());
  if (n === 4) cidDialog(p.cur());
  if (n === 5) download(p.cur());
  if (n === 6) renameDialog(p.cur());
  if (n === 7) uploadDialog();
  if (n === 8) unpinDialog();
  if (n === 9) peersDialog();
  if (n === 10) refreshBoth();
}
document.body.addEventListener('keydown', (e) => {
  if ($('#overlay').classList.contains('show')) {
    if (e.key === 'Escape') closeDialog();
    if (e.key === 'Enter' && window._confirmAction) { const a = window._confirmAction; window._confirmAction = null; a(); }
    return;
  }
  const p = pane();
  const k = e.key;
  if ((k === 'f' && (e.metaKey || e.ctrlKey)) || k === '/') { e.preventDefault(); focusSearch(); return; }
  if (k === 'Escape' && p.filter) { p.setFilter(''); searchBox.value = ''; searchBox.classList.remove('active'); return; }
  if (k === 'Tab') { e.preventDefault(); focusPane(panes[1 - active]); searchBox.value = pane().filter; searchBox.classList.toggle('active', !!pane().filter); }
  else if (k === 'ArrowDown') { e.preventDefault(); p.move(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); p.move(-1); }
  else if (k === 'PageDown') { e.preventDefault(); p.move(20); }
  else if (k === 'PageUp') { e.preventDefault(); p.move(-20); }
  else if (k === 'Home') { e.preventDefault(); p.cursor = 0; p.render(); }
  else if (k === 'End') { e.preventDefault(); p.cursor = p.entries.length - 1; p.render(); }
  else if (k === 'Enter') { e.preventDefault(); p.enter(); }
  else if (k === 'Backspace') { e.preventDefault(); p.up(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); p.back(); }
  else if (k === 'ArrowRight') { e.preventDefault(); if (p.cur()?.dir) p.enter(); }
  else if (k === ' ') { // space = toggle selection, NC-style
    e.preventDefault();
    if (p.selected.has(p.cursor)) p.selected.delete(p.cursor); else p.selected.add(p.cursor);
    p.move(1);
  }
  else if (k === 'F3') { e.preventDefault(); kb(3); }
  else if (k === 'F4') { e.preventDefault(); kb(4); }
  else if (k === 'F5') { e.preventDefault(); kb(5); }
  else if (k === 'F6') { e.preventDefault(); kb(6); }
  else if (k === 'F7') { e.preventDefault(); kb(7); }
  else if (k === 'F8' || k === 'Delete') { e.preventDefault(); kb(8); }
  else if (k === 'F9') { e.preventDefault(); kb(9); }
  else if (k === 'F10' || (k === 'r' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); kb(10); }
  else if (k === 'c' && (e.metaKey || e.ctrlKey)) {
    const eCur = p.cur();
    if (eCur && !eCur.up) {
      clipBoard = { internalDrop: true, cid: eCur.cid, name: eCur.name, paneId: active, isRoot: p.path.length===0, pathJson: JSON.stringify(p.path), action: 'copy' };
      setXfer('Copied ' + eCur.name); setTimeout(()=>setXfer(''), 2000);
    }
  }
  else if (k === 'x' && (e.metaKey || e.ctrlKey)) {
    const eCur = p.cur();
    if (eCur && !eCur.up) {
      clipBoard = { internalDrop: true, cid: eCur.cid, name: eCur.name, paneId: active, isRoot: p.path.length===0, pathJson: JSON.stringify(p.path), action: 'move' };
      setXfer('Cut ' + eCur.name); setTimeout(()=>setXfer(''), 2000);
    }
  }
  else if (k === 'v' && (e.metaKey || e.ctrlKey)) {
    if (clipBoard) {
      performCopyMove(clipBoard, p, null, clipBoard.action).then(() => { if(clipBoard && clipBoard.action==='move') clipBoard = null; });
    }
  }
});

// ---- search -----------------------------------------------------------------------------------

const cidInput = $('#cidInput');
cidInput.onkeydown = async (e) => {
  if (e.key === 'Enter') {
    let val = e.target.value.trim();
    if (val.startsWith('ipfs://')) val = val.slice(7);
    if (val.startsWith('/ipfs/')) val = val.slice(6);
    if (!val) return;
    
    // Check if it's a valid CID format roughly
    if (val.length < 40) {
      alert("Invalid CID format.");
      return;
    }
    
    const p = pane();
    p.path = [{name: val, cid: val}];
    try {
      await p.load();
      p.cursor = 0;
      p.render();
      cidInput.blur();
    } catch(err) {
      alert("Failed to load CID: " + err.message);
    }
  }
};

const searchBox = $('#searchBox');
const typeFilterBox = $('#typeFilterBox');
typeFilterBox.onchange = () => {
  pane().applyFilter();
  pane().cursor = 0;
  pane().render();
};
searchBox.oninput = () => {
  pane().setFilter(searchBox.value.trim());
  searchBox.classList.toggle('active', !!searchBox.value.trim());
};
searchBox.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === 'Escape') { searchBox.value = ''; searchBox.oninput(); searchBox.blur(); document.body.focus(); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') { searchBox.blur(); document.body.focus(); }
};
function focusSearch() { searchBox.value = pane().filter; searchBox.focus(); searchBox.select(); }

// ---- boot -------------------------------------------------------------------------------------
focusPane(panes[0]);
panes.forEach((p) => p.load());
loadPeers();
setInterval(loadPeers, 15000);
document.body.focus();
</script>
</body>
</html>
